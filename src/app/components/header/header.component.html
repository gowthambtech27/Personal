<header [class.scrolled]="isScrolled" class="header">
  <nav class="nav container">
    <div class="nav-brand">
      <a href="#" (click)="scrollToSection('home'); $event.preventDefault()">Portfolio</a>
    </div>

    <ul class="nav-menu" [class.active]="isMenuOpen">
      <li *ngFor="let section of sections">
        <a href="#" (click)="scrollToSection(section.id); $event.preventDefault()">
          {{ section.name }}
        </a>
      </li>
    </ul>
    <!-- Theme Toggle Button -->
    <button class="theme-toggle" (click)="toggleTheme()" aria-label="Toggle theme">
      <i class="fas" [ngClass]="isDarkTheme ? 'fa-sun' : 'fa-moon'"></i>
    </button>
  </nav>
</header>

<div class="hero" id="home">
  <div class="hero-content">
    <div class="hero-text">
      <h1 class="hero-title">
        <span class="greeting">Hello, I'm</span>
        <span class="name">Gowtham Palanichamy</span>
      </h1>
      <p class="hero-subtitle">
        Front-End Developer | 6+ Years Experience Creating Scalable Web Apps
      </p>
      <div class="hero-buttons">
        <a href="#projects" class="btn btn-primary" (click)="scrollToSection('projects'); $event.preventDefault()">
          <i class="fas fa-folder-open"></i> View My Work
        </a>
        <a href="#" class="btn btn-primary" (click)="openResume($event)">
          <i class="fa-solid fa-file"></i> View Resume
        </a>

      </div>

    </div>
    <div class="hero-image">
      <div class="hero-avatar">
        <div class="avatar-circle"></div>
      </div>
    </div>
  </div>
  <div class="scroll-indicator"><span></span></div>
</div>
