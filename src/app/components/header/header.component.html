<header [class.scrolled]="isScrolled" class="header">
  <nav class="nav container">
    <div class="nav-brand">
      <a href="#" (click)="scrollToSection('home'); $event.preventDefault()">
        <img src="assets/favicon.svg" alt="logo" class="brand-icon">
      </a>
    </div>

    <ul class="nav-menu" [class.active]="isMenuOpen">
      <li *ngFor="let section of sections">
        <a href="#" (click)="scrollToSection(section.id); $event.preventDefault()">
          {{ section.name }}
        </a>
      </li>
    </ul>

    <button class="theme-toggle" (click)="toggleTheme()" aria-label="Toggle theme">
      <i class="fas" [ngClass]="isDarkTheme ? 'fa-sun' : 'fa-moon'"></i>
    </button>
  </nav>
</header>

<section class="hero" id="home">

  <!-- QR Code -->
  <div class="hero-qr" style="position: absolute; top: 70px; right: 20px; text-align: right;;">
        <p style="font-size: 10px; margin-top: 5px;">Scan to save my contact</p>

  <qrcode
    [qrdata]="vCard"
    [width]="120"
    [errorCorrectionLevel]="'H'">
  </qrcode>
  </div>

  <div class="hero-content container">

    <div class="hero-text">
      <h1 class="hero-title">
        <span class="greeting">Hi, I'm</span>
        <span class="name">Gowtham Palanichamy</span>
      </h1>

      <p class="hero-subtitle">
Software Engineer | 7+ Years of Experience | Angular • TypeScript • RxJS • Enterprise Web Applications      </p>

      <div class="hero-buttons">
        <a href="#projects" class="btn btn-primary" (click)="scrollToSection('projects'); $event.preventDefault()">
          <i class="fas fa-folder-open"></i>
          My Work
        </a>

        <a href="#" class="btn btn-secondary" (click)="openResume($event)">
          <i class="fas fa-file-pdf"></i>
          Resume
        </a>
      </div>
    </div>

    <div class="hero-image">
      <div class="hero-avatar">
        <img src="assets/images/profile.jpg" alt="Gowtham Palanichamy">
      </div>
    </div>

  </div>

  <div class="scroll-indicator">
    <span></span>
  </div>

</section>
