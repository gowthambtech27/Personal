<section class="skills section" id="skills">
  <div class="container">
    <h2 class="heading-icon" data-icon="&#xf121;">Skills</h2>
    <div class="skills-grid">
      <div class="skill-card" *ngFor="let skill of skills">
          <!-- Circular Progress RIGHT -->
          <div class="skill-circle" style="float: right;">
            <svg viewBox="0 0 36 36" class="badge-circle">
              <path
                class="circle-bg"
                d="M18 2.0845
                   a 15.9155 15.9155 0 0 1 0 31.831
                   a 15.9155 15.9155 0 0 1 0 -31.831" />
              <path
                class="circle"
                [attr.stroke-dasharray]="skill.level + ', 100'"
                d="M18 2.0845
                   a 15.9155 15.9155 0 0 1 0 31.831
                   a 15.9155 15.9155 0 0 1 0 -31.831" />
              <text x="18" y="20.35" class="percentage">
                {{ skill.level }}%
              </text>
            </svg>
          </div>
        <div class="skill-row">
          <!-- Icon LEFT -->
          <div class="skill-icon">
            <i [class]="skill.icon"></i>
          </div>

          <!-- Name Middle -->
          <div class="skill-info">
            <h3 class="skill-name">{{ skill.name }}</h3>
            <h3 class="skill-text">{{ skill.version }}</h3>
          </div>

        
        </div>

      </div>
    </div>
  </div>
  <div>New Features for Pull request</div>
</section>
