<section class="contact section" id="contact">
  <div class="container">
    <h2 class="heading-icon" data-icon="&#xf0e0;">Get In Touch</h2>
    <div class="contact-content">
      <div class="contact-form-wrapper">
        <app-languages></app-languages>
      </div>
      <div class="contact-info">
        <div class="info-card" *ngFor="let item of contactInfo | keyvalue">

          <div class="info-icon">
            <i [class]="item.value.icon"></i>
          </div>

          <!-- Dynamic link handling -->
          <a *ngIf="item.key === 'email'" [href]="'mailto:' + item.value.value">
            {{ item.value.value }}
          </a>

          <a *ngIf="item.key === 'phone'" [href]="'tel:' + item.value.value">
            {{ item.value.value }}
          </a>

          <a *ngIf="item.key === 'linkedin'" [href]="item.value.value" target="_blank">
            {{ item.value.value }}
          </a>

          <!-- For items that are not links (e.g., location) -->
          <p *ngIf="item.key === 'location'">
            {{ item.value.value }}
          </p>

        </div>
      </div>


    </div>
  </div>
</section>

<footer class="footer">
  <div class="container">
    <p>&copy; {{ currentYear }} Gowtham Palanichamy. All rights reserved.</p>
    <p class="footer-text">Built with ❤️ using Angular | Front-End Developer</p>
  </div>
</footer>
