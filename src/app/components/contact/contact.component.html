<section class="contact section" id="contact">
  <div class="container">
    <h2 class="heading-icon" data-icon="&#xf0e0;">Get In Touch</h2>
    <div class="contact-content">
      <div class="contact-form-wrapper">
        <app-languages></app-languages>
      </div>
      <div class="contact-info">
        <div class="info-card">
          <div class="info-icon">📧</div>
          <h3>Email</h3>
          <a [href]="'mailto:' + contactInfo.email">{{ contactInfo.email }}</a>
        </div>
        <div class="info-card">
          <div class="info-icon">📱</div>
          <h3>Phone</h3>
          <a [href]="'tel:' + contactInfo.phone">{{ contactInfo.phone }}</a>
        </div>
        <div class="info-card">
          <div class="info-icon">📍</div>
          <h3>Location</h3>
          <p>{{ contactInfo.location }}</p>
        </div>
      </div>

    </div>
  </div>
</section>

<footer class="footer">
  <div class="container">
    <p>&copy; {{ currentYear }} Gowtham Palanichamy. All rights reserved.</p>
    <p class="footer-text">Built with ❤️ using Angular | Front-End Developer</p>
  </div>
</footer>
