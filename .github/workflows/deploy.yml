name: Deploy Angular Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular App
        shell: bash
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          NO_COLOR: "1"
        run: |
          set +e
          echo "Node: $(node --version) | npm: $(npm --version)"

          npm run build -- --configuration=production --base-href "/${REPO_NAME}/" 2>&1 | tee angular-build.log
          STATUS=${PIPESTATUS[0]}

          if [ "$STATUS" -ne 0 ]; then
            echo "===== Key Error Lines ====="
            grep -nE "ERROR|Error:|TS[0-9]+|NG[0-9]+|budget|heap|not supported" angular-build.log | head -30
          fi
          exit "$STATUS"

      - name: Detect dist folder
        run: |
          INDEX=$(find dist -name index.html -print -quit)
          if [ -z "$INDEX" ]; then
            echo "::error::No index.html found under dist/"
            ls -R dist || true
            exit 1
          fi
          DIST_PATH=$(dirname "$INDEX")
          echo "DIST_PATH=$DIST_PATH" >> "$GITHUB_ENV"
          cp "$DIST_PATH/index.html" "$DIST_PATH/404.html"

      - name: Upload build files
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.DIST_PATH }}

      - name: Upload Angular build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: angular-build-log
          path: angular-build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4