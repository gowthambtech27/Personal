
name: Deploy Angular Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v5

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # 3. Check project configuration
      - name: Check Angular Configuration
        run: |
          node --version
          npm --version
          test -f package.json
          test -f package-lock.json
          test -f angular.json
          echo "Project configuration files found."

      # 4. Install dependencies
      - name: Install Dependencies
        run: npm ci

      # 5. Build Angular application
      - name: Build Angular App
        run: |
          npm run build -- --configuration=production --base-href "/${{ github.event.repository.name }}/"

      # 6. Detect and validate Angular output
      - name: Detect Angular Build Output
        id: detect-dist
        shell: bash
        run: |
          DIST_PATH=$(node -e "
            const a = require('./angular.json');
            const name = a.defaultProject || Object.keys(a.projects)[0];
            const project = a.projects[name];
            const build = project.architect?.build || project.targets?.build;
            if (!build || !build.options.outputPath) {
              throw new Error('Angular build outputPath not found');
            }
            const output = build.options.outputPath;
            console.log(typeof output === 'string' ? output : output.base);
          ")

          echo "Configured output path: $DIST_PATH"

          if [ -f "$DIST_PATH/browser/index.html" ]; then
            DIST_PATH="$DIST_PATH/browser"
          elif [ -f "$DIST_PATH/index.html" ]; then
            :
          else
            echo "ERROR: Angular index.html was not found."
            echo "Available index.html files:"
            find dist -maxdepth 5 -type f -name index.html || true
            exit 1
          fi

          echo "DIST_PATH=$DIST_PATH" >> "$GITHUB_ENV"
          echo "Verified deployment directory: $DIST_PATH"
          ls -la "$DIST_PATH"

      # 7. Upload build files
      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.DIST_PATH }}

      # 8. Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
