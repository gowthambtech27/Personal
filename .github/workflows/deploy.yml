name: Deploy Angular App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20   # match your local Node version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular App
        id: angular-build
        shell: bash
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          NODE_OPTIONS: --max_old_space_size=4096
          NO_COLOR: "1"
        run: |
          set +e

          echo "===== Node Version ====="
          node --version

          echo "===== NPM Version ====="
          npm --version

          echo "===== Angular Build Started ====="
          npm run build -- --configuration=production --base-href "/${REPO_NAME}/" 2>&1 | tee angular-build.log

          BUILD_STATUS=${PIPESTATUS[0]}

          echo "===== Angular Build Exit Code: $BUILD_STATUS ====="

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "===== Key Error Lines ====="
            grep -nE "ERROR|Error:|TS[0-9]+|NG[0-9]+|budget|heap|Cannot find|not found" angular-build.log | head -30

            FIRST_ERROR=$(grep -m1 -E "ERROR|Error:|TS[0-9]+|NG[0-9]+|budget|heap" angular-build.log)
            echo "::error title=Angular build failed::${FIRST_ERROR:-See angular-build.log artifact}"
          fi

          exit "$BUILD_STATUS"

      - name: Upload Angular Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: angular-build-log
          path: angular-build.log
          retention-days: 7
          if-no-files-found: ignore