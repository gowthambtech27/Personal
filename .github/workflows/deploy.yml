
      - name: Build Angular App
        id: angular-build
        shell: bash
        run: |
          set +e

          echo "===== Node Version ====="
          node --version

          echo "===== NPM Version ====="
          npm --version

          echo "===== Angular Build Started ====="
          npm run build -- --configuration=production --base-href "/${{ github.event.repository.name }}/" 2>&1 | tee angular-build.log

          BUILD_STATUS=${PIPESTATUS[0]}

          echo "===== Angular Build Exit Code: $BUILD_STATUS ====="
          exit "$BUILD_STATUS"

      - name: Upload Angular Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: angular-build-log
          path: angular-build.log
          if-no-files-found: ignore
